name: Extension checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check JavaScript syntax
        run: find . -path './.git' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - run: node tests/check.cjs
      - run: python tests/check_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: mcgraw-hill-smartbook-autopilot-installation
          path: dist/mcgraw-hill-smartbook-autopilot-*.zip

